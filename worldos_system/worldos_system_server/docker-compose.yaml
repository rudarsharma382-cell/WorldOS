services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: worldos_system
      POSTGRES_PASSWORD: "vlM0xroAv-WU2btkl4txpbidw2A4zqBP"
    volumes:
      - worldos_system_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Wxk3i_Znxbqq7SyShYLuaWdVuOTvIbng"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: worldos_system_test
      POSTGRES_PASSWORD: "xwHptb5zOuIhBA46o3gzwna6pkPBBHCC"
    volumes:
      - worldos_system_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "AZs-1K-Jdt2eiIZMcdfvxNlmlPbyB5Yw"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  worldos_system_data:
  worldos_system_test_data:
